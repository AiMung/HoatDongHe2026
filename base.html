<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template - Cổng Sinh Hoạt Hè 2026</title>
  <meta name="description" content="Template chung cho các trang Cổng Sinh Hoạt Hè 2026">
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    :root{
      --accent: #ff7a18;
      --accent-2: #ffb703;
      --bg: #f7f9fc;
      --card: #ffffff;
      --muted: #6b7280;
      --radius-md: 12px;
      --shadow-sm: 0 6px 18px rgba(16,24,40,0.06);
      --glass-border: 1px solid rgba(255,255,255,0.06);
    }

    html,body{height:100%;font-family:'Outfit',system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    .app-shell{display:flex;min-height:100vh;background:var(--bg)}
    .sidebar{width:260px;background:linear-gradient(180deg,#fff,#fbfbff);padding:20px;border-right:1px solid rgba(0,0,0,0.04)}
    .brand-logo{width:44px;height:44px;border-radius:8px;object-fit:cover}
    .brand-title{display:block;font-weight:700;color:#0f172a;margin-top:6px}
    .main-content{flex:1;padding:26px;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .topbar-title{font-size:1.15rem;margin:0;color:#0f172a}
    .container-fluid{max-width:1100px;margin:0 auto}
    .card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:18px}
    .welcome-banner{background:linear-gradient(90deg,#fff 0%, rgba(255,255,255,0.7) 100%);padding:22px;border-radius:12px;margin-bottom:20px}
    .gradient-text{background:linear-gradient(90deg,#ff7a18,#ffb703);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .stat-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:10px}
    .stat-icon-box{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center}
    .countdown-card{padding:16px;border-radius:10px}

    @media(max-width:900px){.sidebar{display:none}.mobile-header{display:flex}}
  </style>

  <script>
    (function () {
      const currentTheme = localStorage.getItem('theme');
      if (currentTheme === 'dark') document.documentElement.classList.add('dark-theme');
    })();
  </script>
</head>

<body>
  <div class="app-shell">
    <!-- Left Sidebar (shared) -->
    <aside class="sidebar">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
        <img src="image/logo_DTN.webp" alt="Logo" class="brand-logo">
        <div>
          <div class="brand-title">MÙA HÈ TÌNH NGUYỆN</div>
          <div style="font-size:12px;color:var(--muted)">Chiến Dịch Hè 2026</div>
        </div>
      </div>

      <nav style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-chart-line"></i> Trang chủ</a>
        <a href="event.html" class="sidebar-link"><i class="fa-solid fa-calendar-days"></i> Kế hoạch</a>
        <a href="attendance.html" class="sidebar-link"><i class="fa-solid fa-clipboard-user"></i> Điểm danh</a>
        <a href="gallery.html" class="sidebar-link"><i class="fa-solid fa-images"></i> Thư viện</a>
      </nav>

      <div style="margin-top:auto;padding-top:14px;border-top:1px solid rgba(0,0,0,0.03);">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:8px;background:#eef2ff;display:flex;align-items:center;justify-content:center">BTC</div>
          <div>
            <div style="font-weight:600">Ban Chỉ Đạo Hè</div>
            <div style="font-size:12px;color:var(--muted)">Người điều hành</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main area where pages inject content -->
    <main class="main-content">
      <header class="topbar">
        <h2 class="topbar-title">Bảng Điều Khiển</h2>
        <div class="topbar-meta" style="font-size:0.95rem;color:var(--muted);display:flex;gap:14px;align-items:center">
          <span><i class="fa-regular fa-calendar"></i> Tháng 06 - Tháng 08/2026</span>
          <span><i class="fa-regular fa-clock"></i> Local: 2026-05-25</span>
        </div>
      </header>

      <div id="page-content" class="container-fluid">
        <!-- PAGE CONTENT will be injected here per-page -->
      </div>
    </main>
  </div>

  <script>
    // Simple helper to mount per-page HTML into the layout
    function mountPage(html) {
      const target = document.getElementById('page-content');
      if (!target) return;
      target.innerHTML = html;
      // execute scripts inside injected HTML
      target.querySelectorAll('script').forEach(s => {
        const n = document.createElement('script');
        if (s.src) n.src = s.src;
        n.textContent = s.textContent;
        document.body.appendChild(n);
        s.remove();
      });
    }
    window.mountPage = mountPage;
  </script>
</body>

</html>
