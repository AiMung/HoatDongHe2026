<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
:root {
  --bg-color: #0f172a;
  --primary: #0ea5e9;
  --text-main: #f8fafc;
}

#loader {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}

.loader-logo-wrapper {
  width: 130px;
  height: 130px;
  margin-bottom: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.loader-logo {
  width: 90px;
  height: 90px;
  object-fit: contain;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.6));
  z-index: 10;
}

.loader-pulse-ring {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid var(--primary);
  animation: pulse-ring-expand 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}

@keyframes pulse-ring-expand {
  0% { transform: scale(0.8); opacity: 0.8; }
  100% { transform: scale(2); opacity: 0; }
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

.loader-title {
  font-size: clamp(14px, 5vw, 2.5rem);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #fff, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 5px;
  white-space: nowrap;
}

.loader-subtitle {
  font-size: clamp(10px, 2.5vw, 1.1rem);
  color: #94a3b8;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 40px;
  white-space: nowrap;
}

.loader-progress-bar {
  width: 280px;
  max-width: 80vw;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 15px;
}

.loader-progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #0ea5e9, #38bdf8);
  border-radius: 4px;
  transition: width 0.1s linear;
}

.loader-text {
  font-size: 0.85rem;
  color: var(--primary);
  letter-spacing: 1px;
  font-family: monospace;
}
</style>
</head>
<body>
<div id="loader">
  <div class="loader-logo-wrapper">
    <img src="./image/logo_DTN.webp" alt="Logo" class="loader-logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/vi/a/a2/Huy_hieu_Doan.png';" />
    <div class="loader-pulse-ring"></div>
  </div>
  <div class="loader-title">MÙA HÈ XUÂN HƯƠNG</div>
  <div class="loader-subtitle">Khởi tạo hệ thống...</div>
  <div class="loader-progress-bar"><div class="loader-progress" id="loader-progress"></div></div>
  <div class="loader-text" id="loader-text">Đang chuẩn bị...</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    let progress = 0;
    const progressBar = document.getElementById('loader-progress');
    const loaderText = document.getElementById('loader-text');
    const steps = [
      "Khởi tạo hệ thống...",
      "Tải tài nguyên...",
      "Kết nối cơ sở dữ liệu...",
      "Chuẩn bị giao diện...",
      "Hoàn tất. Đang chuyển..."
    ];
    const interval = setInterval(() => {
      progress += Math.random() * 4 + 1.5; // simulate loading
      if (progress > 100) progress = 100;
      progressBar.style.width = progress + '%';
      if (progress < 20) loaderText.innerText = steps[0];
      else if (progress < 45) loaderText.innerText = steps[1];
      else if (progress < 70) loaderText.innerText = steps[2];
      else if (progress < 90) loaderText.innerText = steps[3];
      else loaderText.innerText = steps[4];
      if (progress === 100) {
        clearInterval(interval);
        setTimeout(() => {
          const loader = document.getElementById('loader');
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          // Redirect to login page
          window.location.href = 'login.html';
        }, 400);
      }
    }, 100);
  });
</script>
</body>
</html>
