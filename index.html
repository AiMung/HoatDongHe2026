<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Thông Tin Sinh Hoạt Hè 2026 - 3D Experience</title>
  <meta name="description" content="Trang chủ 3D ấn tượng của chiến dịch MÙA HÈ XUÂN HƯƠNG - ĐÀ LẠT 2026">

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background-color: #050505;
      overflow: hidden;
    }

    /* Spline viewer covers the whole screen */
    spline-viewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Glassmorphism overlay for content */
    .landing-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      /* Let clicks pass through to Spline */
    }

    .content-box {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 50px;
      text-align: center;
      max-width: 600px;
      pointer-events: auto;
      /* Enable clicks on this box */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(20px);
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.5s;
    }

    @keyframes fadeUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 20px;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    h1 {
      color: white;
      font-size: 3rem;
      font-weight: 800;
      margin: 0 0 16px 0;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .cta-btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: white;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .cta-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: all 0.5s ease;
    }

    .cta-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 25px rgba(59, 130, 246, 0.4);
    }

    .cta-btn:hover::before {
      left: 100%;
    }

    /* Hide the Spline logo if possible (though their free tier requires it, we can push it down) */
    spline-viewer::part(logo) {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Spline 3D Viewer -->
  <!-- Note: This is a placeholder beautiful interactive Spline scene -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.3/build/spline-viewer.js"></script>
  <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"></spline-viewer>

  <!-- Overlay Content -->
  <div class="landing-overlay">
    <div class="content-box">
      <div class="badge">MÙA HÈ XUÂN HƯƠNG - ĐÀ LẠT 2026</div>
      <h1>Cổng Thông Tin<br>Sinh Hoạt Hè</h1>
      <p>Trải nghiệm hệ thống quản lý, điểm danh và lưu giữ khoảnh khắc tuổi trẻ năng động, trực quan và đẳng cấp nhất.
      </p>
      <a href="dashboard.html" class="cta-btn">Vào Hệ Thống Ngay</a>
    </div>
  </div>

  <script>
    // Logic to directly redirect if user is already logged in and it's a direct visit, 
    // but here we might want them to see the 3D page anyway. 
    // Let's only redirect if they are not logged in when they click the CTA.
    document.querySelector('.cta-btn').addEventListener('click', function (e) {
      e.preventDefault();
      const user = localStorage.getItem("summer_user");
      if (user) {
        window.location.href = "dashboard.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</body>

</html>
